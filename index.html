<!DOCTYPE html>
<html>
<head>
<style>
@font-face{
  font-family: "Miraland";
  src: url("assets/fonts/Miraland.woff2") format("woff2"),
    url("assets/fonts/Miraland.ttf") format("truetype"),
    url("assets/fonts/Miraland.woff") format("woff");
  font-weight: normal;
  font-style: normal;
  font-display: block;
}

*{
	padding: 0;
	margin: 0;
	border: none;
	touch-action: none;
	user-select: none;
}
:root{
  --nav-h: 60px;

  --feature-color: #4a90d9;
	--bg-color: #F8F8F8;
  --bg-hover-color: #F0F0F0;
	--onbg-color: #333;
  --bg-line-color: #E0E0E0;
	--ct-color: #EEE;
	--onct-color: #CCC;

	background: var(--bg-color);
}
main, header, section, footer, aside, nav, article, figure{
	display: block;
}

html{
	width: 100%;
	height: 100%;
	background-color: var(--bg-color);
  overflow: hidden;
}
body{
	width: 100%;
	height: 100%;
	background-color: var(--bg-color);
  overflow: hidden;
}

#main-page{
  width: 100%;
  height: calc(100vh - var(--nav-h));
}


#content{
  position: absolute;
  left: 0;
  top: calc(100% - var(--nav-h));
  width: 100%;
  height: 100%;
  transform: 0;
  transition: .2s all;
}

#nav{
  width: 100%;
  height: var(--nav-h);
  background-color: #FFF;
  display: flex;
  justify-content: center;
  gap: 20px; 
}
.nav-btn input[type="radio"]{
  position: absolute;
  opacity: 0;
  width: 0;
  height: 0;
  pointer-events: none;
}
.nav-btn{
  line-height: var(--nav-h);
  color: var(--onbg-color);
  font-size: 20px;
  font-weight: 300;
  cursor: pointer;
}
.nav-btn:has(input[type="radio"]:checked){
  font-weight: 500;
}
.nav-btn:hover:not(:has(input:checked)){
  font-weight: 400;
}

#title-box{
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100%;
  white-space: nowrap;
  transform-origin: center;
}
#title{
  text-align: center;
  font-family: "Miraland", "Microsoft YaHei", sans-serif;
  color: #333;
  font-weight: 700;
  font-size: 98px;
  user-select: none;
}
#title-sub{
  margin-left: 10px;
  padding: 0 10px;
  border-radius: 16px;
  line-height: 108px;
  background-color: #333;
  text-align: center;
  font-family: "Miraland", "Microsoft YaHei", sans-serif;
  color: #EEE;
  font-weight: 800;
  font-size: 82px;
  user-select: none;
}

section{
  position: absolute;
  left: 0;
  top: var(--nav-h);
  width: 100%;
  height: calc(100% - var(--nav-h));
  background-color: var(--bg-color);
  display: none;
  overflow-y: auto;
}

</style>
<link rel="stylesheet" href="css/table-page.css">
<link rel="stylesheet" href="css/input-page.css">
</head>
<body>
  <main id="main-page">
    <div id="title-box">
      <!-- Miraland -->
      <!-- <div class="title">&#xf026;&#xf022;&#xf02b;&#xf01a;&#xf025;&#xf01a;&#xf027;&#xf01d;</div> -->
      <!-- QIJIDALU -->
      <div id="title">&#xf02a;&#xf022;&#xf023;&#xf022;&#xf01d;&#xf01a;&#xf025;&#xf02e;</div>
      <div id="title-sub">&#xf032;&#xf02e;</div>
    </div>
  </main>

  <div id="content">
    <nav id="nav">
      <label class="nav-btn">
        <input id="nav-btn-home" type="radio" name="nav" value="home" checked>
        <span>首页</span>
      </label>
      <label class="nav-btn">
        <input id="nav-btn-table" type="radio" name="nav" value="table">
        <span>译表</span>
      </label>
      <label class="nav-btn">
        <input id="nav-btn-input" type="radio" name="nav" value="input">
        <span>输入</span>
      </label>
      <label class="nav-btn">
        <input id="nav-btn-inference" type="radio" name="nav" value="inference">
        <span>推理</span>
      </label>
      <label class="nav-btn">
        <input id="nav-btn-recognition" type="radio" name="nav" value="recognition">
        <span>识别</span>
      </label>
    </nav>

    <!-- table-page -->
    <section id="table-page">

    </section>

    <!-- input-page -->
    <section id="input-page">
      <textarea id="input" placeholder="在此输入文本..."></textarea>
      <div class="mode-group">
        <label><input type="radio" name="mode" value="normal" checked><span>普通文本</span></label>
        <label><input type="radio" name="mode" value="heartcraft"><span>Heartcraft</span></label>
        <label><input type="radio" name="mode" value="terra"><span>Terra</span></label>
      </div>
    </section>

    <!-- inference-page -->
    <section id="inference-page">
      
    </section>

    <!-- recognition-page -->
    <section id="recognition-page">

      <div style="padding-top: 60px; text-align: center;">OCR识别功能正在制作中... 敬请期待！</div>
    </section>
  </div>


</body>
<script src="js/lang-data.js"></script>
<script src="js/watch_radio_group.js"></script>
<script src="js/lc.js"></script>
<script>

const nav = watchRadioGroup("nav");

nav.onSelectedById("nav-btn-home", (e) => {
  document.getElementById("content").style.top = "calc(100% - var(--nav-h))";
});

nav.onUnselectedById("nav-btn-home", (e) => {
  document.getElementById("content").style.top = "0";
});

nav.onSelectedById("nav-btn-table", (e) => {
  document.getElementById("table-page").style.display = "block";
});

nav.onUnselectedById("nav-btn-table", (e) => {
  document.getElementById("table-page").style.display = "none";
});

nav.onSelectedById("nav-btn-input", (e) => {
  document.getElementById("input-page").style.display = "block";
});

nav.onUnselectedById("nav-btn-input", (e) => {
  document.getElementById("input-page").style.display = "none";
});

nav.onSelectedById("nav-btn-inference", (e) => {
  document.getElementById("inference-page").style.display = "block";
});

nav.onUnselectedById("nav-btn-inference", (e) => {
  document.getElementById("inference-page").style.display = "none";
});

nav.onSelectedById("nav-btn-recognition", (e) => {
  document.getElementById("recognition-page").style.display = "block";
});

nav.onUnselectedById("nav-btn-recognition", (e) => {
  document.getElementById("recognition-page").style.display = "none";
});


  
const MAX = 1960;
const PADDING = 20;

const fit = () => {
  const el = document.getElementById('title-box');
  if (!el) return;
  
  // 父容器可用宽度（若父元素不存在则回退到视口宽度）
  const pw = el.parentElement?.clientWidth || window.innerWidth;
  // 元素原始内容宽度（不受当前 transform 影响）
  const nw = document.getElementById('title').scrollWidth + document.getElementById('title-sub').scrollWidth;
  
  // 目标宽度 = min(父容器宽, 850px)
  const target = Math.min(pw - 2 * PADDING, MAX);
  
  const s = nw > target ? target / nw : 1;
  
  el.style.transform = `scale(${s})`;
};

const init = () => {
  const el = document.getElementById('title-box');
  if (!el) return;
  
  fit();
  window.addEventListener('resize', fit);
  
  const ro = new ResizeObserver(fit);
  ro.observe(el);
};

if(document.readyState === 'loading'){
  document.addEventListener('DOMContentLoaded', init);
}else{
  init();
}

</script>
<script src="js/table-page.js"></script>
<script src="js/input-page.js"></script>
</html>
