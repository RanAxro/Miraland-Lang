<!DOCTYPE html>
<html>
<head>
<style>
@font-face{
  font-family: "Miraland";
  src: url("assets/fonts/Miraland.woff2") format("woff2"),
    url("assets/fonts/Miraland.ttf") format("truetype"),
    url("assets/fonts/Miraland.woff") format("woff");
  font-weight: normal;
  font-style: normal;
  font-display: block;
}

*{
	padding: 0;
	margin: 0;
	border: none;
	/* overflow: hidden; */
	touch-action: none;
	user-select: none;
}
:root{
  --nav-h: 60px;

	--bg-color: #F8F8F8;
  --bg-hover-color: #F0F0F0;
	--onbg-color: #333;
  --bg-line-color: #E0E0E0;
	--ct-color: #EEE;
	--onct-color: #CCC;

	background: var(--bg-color);
}
main, header, section, footer, aside, nav, article, figure{
	display: block;
}

html{
	width: 100%;
	height: 100%;
	background-color: var(--bg-color);
  overflow: hidden;
}
body{
	width: 100%;
	height: 100%;
	background-color: var(--bg-color);
  overflow: hidden;
}

#main-page{
  width: 100%;
  height: calc(100vh - var(--nav-h));
}


#content{
  position: absolute;
  left: 0;
  top: calc(100% - var(--nav-h));
  width: 100%;
  height: 100%;
  transform: 0;
  transition: .2s all;
}

#nav{
  width: 100%;
  height: var(--nav-h);
  background-color: #FFF;
  display: flex;
  justify-content: center;
  gap: 20px; 
}
.nav-btn input[type="radio"]{
  position: absolute;
  opacity: 0;
  width: 0;
  height: 0;
  pointer-events: none;
}
.nav-btn{
  line-height: var(--nav-h);
  color: var(--onbg-color);
  font-size: 20px;
  font-weight: 300;
}
.nav-btn:has(input[type="radio"]:checked){
  font-weight: 500;
}
.nav-btn:hover:not(:has(input:checked)){
  font-weight: 400;
}

.title-box{
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100%;
}
.title{
  text-align: center;
  font-family: "Miraland", "Microsoft YaHei", sans-serif;
  color: #333;
  font-weight: bold;
  font-size: 98px;
  user-select: none;
}
.title-sub{
  border-radius: 8;
  background-color: #333;
  text-align: center;
  font-family: "Miraland", "Microsoft YaHei", sans-serif;
  color: #EEE;
  font-weight: bold;
  font-size: 98px;
  user-select: none;
}




section{
  position: absolute;
  left: 0;
  top: var(--nav-h);
  width: 100%;
  height: calc(100% - var(--nav-h));
  background-color: var(--bg-color);
  display: none;
  overflow-y: auto;
}

#table-page{
  /* background-color: red; */
}
#input-page{
  background-color: blue;
}
#inference-page{
  background-color: green;
}

</style>
<link rel="stylesheet" href="css/table-page.css">
</head>
<body>
  <main id="main-page">
    <div class="title-box">
      <!-- Miraland -->
      <!-- <div class="title">&#xf026;&#xf022;&#xf02b;&#xf01a;&#xf025;&#xf01a;&#xf027;&#xf01d;</div> -->
      <!-- QIJIDALU -->
      <div class="title">&#xf02a;&#xf022;&#xf023;&#xf022;&#xf01d;&#xf01a;&#xf025;&#xf02e;</div>
      <div class="title-sub">&#xf032;&#xf02e;</div>
    </div>
  </main>

  <div id="content">
    <nav id="nav">
      <label class="nav-btn">
        <input id="nav-btn-home" type="radio" name="nav" value="home" checked>
        <span>首页</span>
      </label>
      <label class="nav-btn">
        <input id="nav-btn-table" type="radio" name="nav" value="table">
        <span>译表</span>
      </label>
      <label class="nav-btn">
        <input id="nav-btn-input" type="radio" name="nav" value="input">
        <span>输入</span>
      </label>
      <label class="nav-btn">
        <input id="nav-btn-inference" type="radio" name="nav" value="inference">
        <span>推理</span>
      </label>
    </nav>

    <section id="table-page">

    </section>
    <section id="input-page">
      
    </section>
    <section id="inference-page">
      
    </section>
  </div>


</body>
<script src="js/watch_radio_group.js"></script>
<script>

const nav = watchRadioGroup("nav");

nav.onSelectedById("nav-btn-home", (e) => {
  document.getElementById("content").style.top = "calc(100% - var(--nav-h))";
});

nav.onUnselectedById("nav-btn-home", (e) => {
  document.getElementById("content").style.top = "0";
});

nav.onSelectedById("nav-btn-table", (e) => {
  document.getElementById("table-page").style.display = "block";
});

nav.onUnselectedById("nav-btn-table", (e) => {
  document.getElementById("table-page").style.display = "none";
});

nav.onSelectedById("nav-btn-input", (e) => {
  document.getElementById("input-page").style.display = "block";
});

nav.onUnselectedById("nav-btn-input", (e) => {
  document.getElementById("input-page").style.display = "none";
});

nav.onSelectedById("nav-btn-inference", (e) => {
  document.getElementById("inference-page").style.display = "block";
});

nav.onUnselectedById("nav-btn-inference", (e) => {
  document.getElementById("inference-page").style.display = "none";
